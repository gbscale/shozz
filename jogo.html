<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SHOZZ | Bug Hunter - O Jogo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap" rel="stylesheet">

    <style>
        :root {
            --brand-bg: #FFFAF0;
            --brand-card-bg: #FCFAEE;
            --brand-cream: #DEB887;
            --brand-yellow: #D4A338;
            --brand-light-green: #DFE5CE;
            --brand-olive: #5C6B28;
            --brand-dark-olive: #434F1C;
            --brand-text-dark: #2C301B;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--brand-bg);
            color: var(--brand-text-dark);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .card-shozz {
            background-color: var(--brand-card-bg);
            border: 1px solid var(--brand-cream);
            border-radius: 1rem;
        }

        .btn-olive {
            background-color: var(--brand-olive);
            color: #FFFFFF;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .btn-olive:hover {
            background-color: var(--brand-dark-olive);
            color: #FFFFFF;
        }

        /* Área do Jogo */
        #game-board {
            position: relative;
            height: 400px;
            background-color: #2C301B;
            border-radius: 1rem;
            overflow: hidden;
            border: 2px solid var(--brand-cream);
            cursor: crosshair;
        }

        /* O Bug / Inseto */
        .bug-item {
            position: absolute;
            width: 55px;
            height: 55px;
            background-color: var(--brand-yellow);
            color: var(--brand-text-dark);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            transition: transform 0.1s ease;
            user-select: none;
        }

        .bug-item:active {
            transform: scale(0.8);
        }
    </style>
</head>
<body class="py-4">

    <div class="container text-center">
        <header class="mb-4">
            <h1 class="fw-black text-brand-dark" style="font-weight: 900;">
                SHOZZ<span class="text-brand-yellow">.</span> Bug Hunter
            </h1>
            <p class="text-brand-dark opacity-75">Elimine os bugs do sistema antes que o tempo acabe!</p>
        </header>

        <div class="row justify-content-center mb-3">
            <div class="col-md-8">
                <div class="card-shozz p-3 shadow-sm d-flex flex-row justify-content-around align-items-center">
                    <div>
                        <span class="d-block small text-muted text-uppercase fw-bold">Pontuação</span>
                        <span id="score" class="fs-4 fw-bold text-brand-olive">0</span>
                    </div>
                    <div class="vr"></div>
                    <div>
                        <span class="d-block small text-muted text-uppercase fw-bold">Tempo Restante</span>
                        <span id="timer" class="fs-4 fw-bold text-danger">30</span>s
                    </div>
                </div>
            </div>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div id="game-board" class="shadow">
                    <div id="game-overlay" class="position-absolute top-0 start-0 w-100 h-100 d-flex flex-column align-items-center justify-content-center bg-dark bg-opacity-75 text-white p-4 rounded-4 z-3">
                        <h2 id="overlay-title" class="fw-bold mb-3">Pronto para caçar bugs?</h2>
                        <p id="overlay-text" class="mb-4 text-center opacity-75">Clique em "Iniciar Jogo" e capture o máximo de insetos de erro de código que conseguir em 30 segundos.</p>
                        <button id="start-btn" class="btn btn-olive px-5 py-3 rounded-pill shadow">Iniciar Jogo</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer class="text-center mt-4">
        <p class="small text-muted mb-0">&copy; 2026 SHOZZ Sistemas. Todos os direitos reservados.</p>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const gameBoard = document.getElementById('game-board');
        const scoreDisplay = document.getElementById('score');
        const timerDisplay = document.getElementById('timer');
        const startBtn = document.getElementById('start-btn');
        const gameOverlay = document.getElementById('game-overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayText = document.getElementById('overlay-text');

        let score = 0;
        let timeLeft = 30;
        let gameInterval = null;
        let bugSpawner = null;
        let isPlaying = false;

        startBtn.addEventListener('click', startGame);

        function startGame() {
            // Resetar variáveis
            score = 0;
            timeLeft = 30;
            scoreDisplay.textContent = score;
            timerDisplay.textContent = timeLeft;
            
            // Esconder tela de início
            gameOverlay.classList.add('d-none');
            isPlaying = true;

            // Limpar bugs antigos se houver
            document.querySelectorAll('.bug-item').forEach(b => b.remove());

            // Iniciar contagem regressiva do tempo
            gameInterval = setInterval(() => {
                timeLeft--;
                timerDisplay.textContent = timeLeft;

                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);

            // Iniciar gerador de bugs dinâmicos
            bugSpawner = setInterval(createBug, 700);
        }

        function createBug() {
            if (!isPlaying) return;

            const bug = document.createElement('div');
            bug.classList.add('bug-item');
            bug.innerHTML = '<i class="fa-solid fa-bug"></i>';

            // Posição randômica dentro do tabuleiro
            const maxWidth = gameBoard.clientWidth - 60;
            const maxHeight = gameBoard.clientHeight - 60;
            const randomX = Math.floor(Math.random() * maxWidth);
            const randomY = Math.floor(Math.random() * maxHeight);

            bug.style.left = randomX + 'px';
            bug.style.top = randomY + 'px';

            // Evento de clique no bug
            bug.addEventListener('click', () => {
                if (!isPlaying) return;
                score += 10;
                scoreDisplay.textContent = score;
                
                // Efeito visual rápido de clique e remoção
                bug.remove();
            });

            gameBoard.appendChild(bug);

            // O bug some sozinho após 1.2 segundos se não for clicado
            setTimeout(() => {
                if (bug.parentElement) {
                    bug.remove();
                }
            }, 1200);
        }

        function endGame() {
            isPlaying = false;
            clearInterval(gameInterval);
            clearInterval(bugSpawner);

            // Remover bugs restantes da tela
            document.querySelectorAll('.bug-item').forEach(b => b.remove());

            // Mostrar tela de fim de jogo
            overlayTitle.textContent = "Fim de Jogo!";
            overlayText.innerHTML = `Você pontuou <strong>${score} pontos</strong> eliminando os bugs do sistema!`;
            startBtn.textContent = "Jogar Novamente";
            gameOverlay.classList.remove('d-none');
        }
    </script>
</body>
</html>
